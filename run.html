<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="キーを回してエンジンがかかり、吹け上がり、シフトとアクセルで回転が変わり、止まるまでを、グラフと3Dで学ぶページ">
<title>エンジンの始動から停止まで | CAR STUDY LAB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=STIX+Two+Text:ital@1&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <nav class="buttons sites" aria-label="サイトの切り替え">
    <a href="index.html">ギヤボックスLAB</a>
    <a href="car-study.html" class="current">CAR STUDY LAB</a>
    <span class="crumb">＞ エンジンの始動から停止まで　<a href="car-study.html" class="back">テーマを選び直す</a></span>
  </nav>
  <nav class="steps" id="steps" aria-label="学ぶ順番"></nav>
</header>

<main class="bench">
  <section class="stage">
    <div class="view3d">
      <canvas id="scene3d" hidden aria-label="3Dの図"></canvas>
      <p class="hint" id="hint3d" hidden></p>
      <canvas id="chart" aria-label="エンジンの始動から停止までのグラフ"></canvas>
    </div>
    <div class="bar">
      <div class="buttons">
        <button type="button" id="showChart">図</button>
        <button type="button" id="show3d">3D</button>
        <button type="button" id="run" hidden></button>
      </div>
      <div class="buttons" id="controls"></div>
      <p class="readout" id="readout"></p>
    </div>
  </section>

  <section class="panel">
    <h2 id="lessonTitle"></h2>
    <div class="buttons" id="tabs">
      <button type="button" data-tab="structure">考え方</button>
      <button type="button" data-tab="formula">数式</button>
    </div>
    <div class="body"><div id="lessonOutput"></div></div>
    <div class="buttons pager">
      <button type="button" id="prev">前へ</button>
      <button type="button" id="next">次へ</button>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="explain.js"></script>
<script src="study.js"></script>
<script src="study3d.js"></script>
<script src="run.js"></script>
</body>
</html>
