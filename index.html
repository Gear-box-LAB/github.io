<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="マニュアルトランスミッションを、歯車2枚から順に部品を足しながら、3Dの図と数式で学ぶサイト">
<title>ギヤボックスLAB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=STIX+Two+Text:ital@1&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>ギヤボックスLAB</h1>
  <nav class="steps" id="steps" aria-label="学ぶ順番"></nav>
</header>

<main class="bench">
  <section class="stage" id="stageBox">
    <canvas id="stage" aria-label="ギヤボックスの3Dの図"></canvas>
    <p class="hint">部品をクリックすると説明が開きます。ドラッグで向きを変え、ホイールで拡大できます。</p>

    <aside class="bubble" id="bubble" hidden>
      <button type="button" class="close" id="bubbleClose">閉じる</button>
      <h3 id="bubbleTitle"></h3>
      <div id="bubbleBody"></div>
    </aside>

    <div class="bar">
      <div class="buttons" id="gearButtons"></div>
      <button type="button" id="clutchButton" hidden></button>
      <div class="buttons" id="detailButtons"></div>
      <div class="buttons" id="engineInputs">
        <label>エンジン回転数 <input type="number" id="rpm" value="3000" min="0" step="100"> rpm</label>
        <label>トルク <input type="number" id="torque" value="200" min="1" step="10"> N·m</label>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2 id="lessonTitle"></h2>
    <div class="buttons" id="tabs">
      <button type="button" data-tab="structure">構造</button>
      <button type="button" data-tab="formula">数式</button>
    </div>
    <div class="body">
      <div id="lessonInputs"></div>
      <div id="lessonOutput"></div>
    </div>
    <div class="buttons pager">
      <button type="button" id="prev">前へ</button>
      <button type="button" id="next">次へ</button>
    </div>
  </section>
</main>

<!-- 3Dの描画ライブラリ（Three.js） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="calc.js"></script>
<script src="scene.js"></script>
<script src="synchro.js"></script>
<script src="drum.js"></script>
<script src="app.js"></script>
</body>
</html>
