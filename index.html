<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="マニュアルトランスミッションを、歯車2枚から順に部品を足しながら、3Dの図と数式で学ぶサイト">
<title>ギヤボックスLAB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=STIX+Two+Text:ital@1&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <nav class="buttons sites" aria-label="サイトの切り替え">
    <a href="index.html" class="current" aria-current="page">ギヤボックスLAB</a>
    <a href="car-study.html">CAR STUDY LAB</a>
  </nav>
  <nav class="steps" id="steps" aria-label="学ぶ順番"></nav>
</header>

<main class="bench">
  <section class="stage" id="stageBox">
    <div class="view3d">   <!-- 3Dの図と、その上に重ねる物（下の操作の帯には重ねない） -->
    <canvas id="stage" aria-label="ギヤボックスの3Dの図"></canvas>
    <p class="hint" id="hint"></p>
    <div class="buttons view" id="viewButtons"></div>

    <aside class="graph" id="graphBox" hidden aria-label="アウトプット軸の回転数のグラフ">
      <div class="graphHead">
        <b>アウトプット軸の回転数 (rpm)</b>
        <span id="graphNow"></span>
        <button type="button" id="graphClose">閉じる</button>
      </div>
      <canvas id="graphCanvas"></canvas>
      <div class="buttons graphScroll">
        <input type="range" id="graphScroll" min="0" max="0" step="0.1" value="0" aria-label="グラフの表示位置（秒）">
        <button type="button" id="graphFollow" hidden>最新へ</button>
      </div>
      <div class="buttons">
        <button type="button" id="graphStart">計測開始</button>
        <button type="button" id="graphStop">中止</button>
        <button type="button" id="graphReset">リセット</button>
      </div>
    </aside>
    </div>

    <aside class="bubble" id="bubble" hidden>
      <button type="button" class="close" id="bubbleClose">閉じる</button>
      <h3 id="bubbleTitle"></h3>
      <div id="bubbleBody"></div>
    </aside>

    <div class="bar">
      <div class="buttons" id="gearButtons"></div>
      <div class="buttons" id="pedalBox" hidden>
        <div class="buttons" id="clutchMode"></div>
        <label>クラッチペダル <input type="range" id="pedal" min="0" max="100" value="0"> <span id="pedalValue">0%</span></label>
        <button type="button" id="restartEngine" hidden>エンジンをかけ直す</button>
      </div>
      <label id="brakeBox" hidden>ブレーキ（アウトプット軸） <input type="range" id="brake" min="0" max="100" value="0"> <span id="brakeValue">0%</span></label>
      <div class="buttons" id="detailButtons"></div>
      <div class="buttons" id="engineInputs">
        <span class="buttons" id="inputMode"></span>
        <label class="byEngine">エンジン回転数 <input type="number" id="rpm" value="3000" min="0" step="100"> rpm</label>
        <label class="byEngine">トルク <input type="number" id="torque" value="200" min="1" step="10"> N·m</label>
        <label class="bySpeed">目標の車速 <input type="number" id="speed" value="60" min="0" step="10"> km/h</label>
        <label>回転の見せ方 <select id="slow">
          <option value="40">1/40の速さ</option>
          <option value="10">1/10の速さ</option>
          <option value="4">1/4の速さ</option>
        </select></label>
      </div>
      <p class="readout" id="simReadout" hidden></p>
    </div>
  </section>

  <section class="panel">
    <h2 id="lessonTitle"></h2>
    <div class="buttons" id="tabs">
      <button type="button" data-tab="structure">構造</button>
      <button type="button" data-tab="formula">数式</button>
    </div>
    <div class="body">
      <div id="lessonInputs"></div>
      <div id="lessonOutput"></div>
    </div>
    <div class="buttons pager">
      <button type="button" id="prev">前へ</button>
      <button type="button" id="next">次へ</button>
    </div>
  </section>
</main>

<!-- 3Dの描画ライブラリ（Three.js） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="calc.js"></script>
<script src="graph.js"></script>   <!-- 3Dの図より先に読む（図の毎フレームから呼ぶため） -->
<script src="scene.js"></script>
<script src="synchro.js"></script>
<script src="drum.js"></script>
<script src="hshift.js"></script>
<script src="car.js"></script>
<script src="clutch.js"></script>
<script src="app.js"></script>
</body>
</html>
