<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="回転体のイナーシャ（慣性モーメント）を、中学生から社会人まで、3Dの図と数式で段階的に学ぶページ">
<title>CAR STUDY LAB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=STIX+Two+Text:ital@1&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <nav class="buttons sites" aria-label="サイトの切り替え">
    <a href="index.html">ギヤボックスLAB</a>
    <a href="car-study.html" class="current">CAR STUDY LAB</a>
    <span class="crumb">＞ 回転体のイナーシャ　<a href="car-study.html" class="back">テーマを選び直す</a></span>
  </nav>
  <nav class="steps" id="steps" aria-label="学ぶ順番"></nav>
</header>

<main class="bench">
  <section class="stage" id="stageBox">
    <div class="view3d">
    <canvas id="stage" aria-label="回る物の3Dの図"></canvas>
    <p class="hint">車の部品にトルクをかけて、回り方を比べます。赤い印で回り方が見えます。ドラッグで向きを変えられます。</p>
    <div class="tags" id="tags" aria-hidden="true"></div>
    <p class="banner" id="banner" hidden></p>
    <canvas class="strip" id="strip" hidden aria-label="それぞれのホイールで走った車の進み方"></canvas>
    </div>
    <div class="bar">
      <div class="buttons">
        <button type="button" id="push">同じトルクで回す</button>
        <button type="button" id="auto" hidden>自動で変速（1速 → 6速）</button>
        <button type="button" id="stop">止める</button>
      </div>
      <div class="buttons" id="controls"></div>
      <p class="readout" id="readout"></p>
    </div>
  </section>

  <section class="panel">
    <h2 id="lessonTitle"></h2>
    <div class="buttons" id="tabs">
      <button type="button" data-tab="structure">考え方</button>
      <button type="button" data-tab="formula">数式</button>
    </div>
    <div class="body"><div id="lessonOutput"></div></div>
    <div class="buttons pager">
      <button type="button" id="prev">前へ</button>
      <button type="button" id="next">次へ</button>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="inertia.js"></script>
</body>
</html>
